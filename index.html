/* ===== 11-ask.js ===== */
/* ==========================================================================
   ASK CLAUDE
   Two halves, and the split is deliberate:
   1. The app answers factual questions itself, straight from the ledger,
      showing the arithmetic. No network, no API key, no invented numbers.
   2. For open-ended questions it builds a scoped context bundle — the
      smallest slice of data that answers the question — which you copy into
      Cowork. Nothing is uploaded automatically. You see exactly what leaves.
   ========================================================================== */
const SUGGESTED = [
  'Give me today’s financial summary.',
  'How much can I spend this month?',
  'Am I over budget?',
  'Where did my money go?',
  'Compare this month with last month.',
  'Show my yearly savings.',
  'Explain my net worth.',
  'Summarize my financial health.',
  'Am I on track for the end of the month?',
  'How much did I spend on subscriptions this year?',
  'What was my highest expense this year?',
  'Which expenses increased compared with last month?',
  'What percentage of my income went to housing?',
];

const UNAVAILABLE = what => ({
  title:'That is not in your data yet',
  body:`<p>${esc(what)}</p><p style="margin-top:8px">Nothing has been guessed or filled in. Record the underlying entries and ask again.</p>`,
});

function answerQuestion(qRaw) {
  const q = qRaw.toLowerCase();
  const ym = UI.ym, m = monthStats(ym), y = ym.slice(0, 4);
  const has = m.income > 0 || m.expenses > 0;
  const calc = lines => `<div class="calc">${lines.join('\n')}</div>`;
  const list = items => `<ul>${items.map(([k, v]) => `<li><span>${esc(k)}</span><b>${v}</b></li>`).join('')}</ul>`;

  /* today */
  if (/today/.test(q)) {
    const dv = dailyView();
    return { title:`Today · ${dayLabel(todayISO())}`, body:
      list([['Spent today', money(dv.spentToday)],['Entries today', String(dv.txToday)],['Last 7 days', money(dv.spentWeek)],
            ['Month to date', money(m.expenses)],['Daily average', money(dv.dailyAverage)],
            ['Left to spend', dv.allowanceBase ? money(dv.remainingPot) : 'no plan set'],
            ['Per day for the rest of the month', dv.allowanceBase && dv.daysLeft ? money(Math.max(0, dv.dailyAllowance)) : '—']])
      + (dv.allowanceBase ? calc([`plan for ${ymLabel(ym)} = ${money(dv.allowanceBase)}`,
          `spent so far        = ${money(m.expenses)}`,
          `remaining           = ${money(dv.remainingPot)}`,
          `days left           = ${dv.daysLeft}`,
          `per day             = ${money(dv.remainingPot)} ÷ ${dv.daysLeft} = ${money(dv.dailyAllowance)}`]) : '') };
  }

  /* forecast */
  if (/forecast|project|end of (the )?month|on track|pace|will i/.test(q)) {
    const f = forecast(ym);
    if (!f.spent) return UNAVAILABLE(`Nothing is recorded for ${ymLabel(ym)}, so there is no pace to project from.`);
    return { title:`Projected finish for ${ymLabel(ym)}`, body:
      list([['Spent so far', money(f.spent)],['Days elapsed', String(f.elapsed)],['Pace', money(f.pace) + ' per day'],
            ['Projected month total', money(f.projected)],
            ['Plan', f.plan ? money(f.plan) : 'not set'],
            ['Projected outcome', f.plan ? (f.projected > f.plan ? money(f.projectedOver) + ' over' : money(-f.projectedOver) + ' under') : '—']])
      + calc([`pace      = ${money(f.spent)} ÷ ${f.elapsed} days = ${money(f.pace)}/day`,
              `projected = ${money(f.pace)} × ${f.dim} days = ${money(f.projected)}`,
              ...(f.plan ? [`vs plan   = ${money(f.projected)} − ${money(f.plan)} = ${money(f.projectedOver)}`] : [])]) };
  }

  /* how much can I spend */
  if (/how much can i spend|left to spend|afford/.test(q)) {
    const dv = dailyView();
    if (!dv.allowanceBase) return UNAVAILABLE('You have not set a monthly limit or budget, and no income is recorded for this month, so there is nothing to measure against.');
    return { title:`What is left for ${ymLabel(ym)}`, body:
      list([['Plan', money(dv.allowanceBase)],['Spent', money(m.expenses)],['Remaining', money(dv.remainingPot)],
            ['Days left', String(dv.daysLeft)],['Per day', money(Math.max(0, dv.dailyAllowance))]])
      + calc([`remaining = plan − spent = ${money(dv.allowanceBase)} − ${money(m.expenses)} = ${money(dv.remainingPot)}`,
              `per day   = ${money(dv.remainingPot)} ÷ ${dv.daysLeft} days = ${money(dv.dailyAllowance)}`]) };
  }

  /* over budget */
  if (/over budget|am i over|budget status/.test(q)) {
    const st = budgetStatus(ym).filter(b => b.budget > 0);
    const caps = capStatus();
    if (!st.length && !caps.length) return UNAVAILABLE('No budgets and no spending limits are set, so there is nothing to be over.');
    const over = st.filter(b => b.used >= 100), near = st.filter(b => b.used >= 80 && b.used < 100);
    const capsOver = caps.filter(c => c.over > 0);
    return { title: over.length || capsOver.length ? 'Yes — you are over in places' : 'No, you are within your plan', body:
      (capsOver.length ? `<p>${capsOver.map(c => `<b>${esc(c.label)}</b>: ${money(c.spent)} against ${money(c.amount)} — ${money(c.over)} over.`).join('<br>')}</p>` : '')
      + (st.length ? list(st.map(b => [b.label, `${money(b.actual)} / ${money(b.budget)} · ${pctStr(b.used, 0)}`])) : '')
      + calc([`overall: ${money(m.expenses)} spent of ${money(m.budget)} budgeted = ${pctStr(m.budgetUsed, 1)}`,
              ...(over.length ? [`over budget: ${over.map(b => b.label).join(', ')}`] : []),
              ...(near.length ? [`close to the line: ${near.map(b => b.label).join(', ')}`] : [])]) };
  }

  /* where did money go */
  if (/where did my money go|where.*spend|breakdown|biggest categor|largest categor|overspend/.test(q)) {
    const cats = categoryBreakdown(ym);
    if (!cats.length) return UNAVAILABLE(`No expenses are recorded for ${ymLabel(ym)}.`);
    return { title:`Where your money went in ${ymLabel(ym)}`, body:
      list(cats.map(c => [c.label, `${money(c.spent)} · ${pctStr(c.share, 1)}`]))
      + calc([`total expenses = ${money(m.expenses)} across ${m.txCount} entries`,
              `largest = ${cats[0].label} at ${money(cats[0].spent)} (${pctStr(cats[0].share, 1)} of spending)`]) };
  }

  /* compare months */
  if (/compare.*(month|last month)|vs last month|this month with last/.test(q)) {
    const p = monthStats(shiftYM(ym, -1));
    if (!has && !(p.income || p.expenses)) return UNAVAILABLE('Neither month has any recorded data.');
    const d = (a, b) => `${money(b)} <span style="color:${b - a > 0 ? 'var(--bad)' : 'var(--good)'}">(${b - a >= 0 ? '+' : '−'}${money(Math.abs(b - a)).replace('₹','₹')})</span>`;
    const cats = categoryBreakdown(ym), pc = categoryBreakdown(shiftYM(ym, -1));
    const moves = cats.map(c => ({ ...c, prev: pc.find(x => x.id === c.id)?.spent || 0 }))
      .map(c => ({ ...c, delta: c.spent - c.prev })).filter(c => c.delta !== 0)
      .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).slice(0, 5);
    return { title:`${ymLabel(shiftYM(ym, -1))} → ${ymLabel(ym)}`, body:
      list([['Income', d(p.income, m.income)],['Expenses', d(p.expenses, m.expenses)],['Saved', d(p.savings, m.savings)],
            ['Savings rate', `${pctStr(m.savingsRate)} (was ${pctStr(p.savingsRate)})`]])
      + (moves.length ? `<p style="margin-top:10px;font-weight:600;font-size:.84rem">Biggest movers</p>` + list(moves.map(c => [c.label, `${c.delta > 0 ? '+' : '−'}${money(Math.abs(c.delta)).replace('₹','₹')}`])) : '')
      + calc([`expenses: ${money(p.expenses)} → ${money(m.expenses)}`,
              `change  : ${money(m.expenses - p.expenses)}${p.expenses ? ` (${pctStr(growth(m.expenses, p.expenses))})` : ''}`]) };
  }

  /* yearly savings */
  if (/yearly saving|savings this year|how much did i save|annual saving/.test(q)) {
    const a = annualStatement(y);
    if (!a.activeMonths) return UNAVAILABLE(`Nothing is recorded for ${y}.`);
    return { title:`Savings in ${y}`, body:
      list([['Total income', money(a.totalIncome)],['Total expenses', money(a.totalExpenses)],['Total saved', money(a.savings)],
            ['Savings rate', pctStr(a.savingsRate)],['Best month', a.bestSaving ? `${a.bestSaving.month} · ${money(a.bestSaving.savings)}` : '—'],
            ['Months with data', String(a.activeMonths)]])
      + calc([`savings      = income − expenses`,
              `             = ${money(a.totalIncome)} − ${money(a.totalExpenses)} = ${money(a.savings)}`,
              `savings rate = ${money(a.savings)} ÷ ${money(a.totalIncome)} × 100 = ${pctStr(a.savingsRate, 2)}`]) };
  }

  /* net worth */
  if (/net worth|networth|what do i own|how rich/.test(q)) {
    const bs = balanceSheet();
    if (!bs.totalAssets && !bs.totalLiabilities) return UNAVAILABLE('No assets, liabilities, loans or investments are recorded, so net worth cannot be calculated.');
    const inv = investmentTotals();
    return { title:'Your net worth', body:
      list([['Assets you entered', money(bs.manualAssets)],['Tracked investments', money(inv.current)],['Total assets', money(bs.totalAssets)],
            ['Liabilities you entered', money(bs.manualLiab)],['Loan balances', money(bs.loanOutstanding)],['Total liabilities', money(bs.totalLiabilities)],
            ['Net worth', money(bs.netWorth)]])
      + calc([`net worth = total assets − total liabilities`,
              `          = ${money(bs.totalAssets)} − ${money(bs.totalLiabilities)}`,
              `          = ${money(bs.netWorth)}`]) };
  }

  /* subscriptions */
  if (/subscription/.test(q)) {
    const s = subscriptionSummary();
    const spentThisYear = sum(inY(S.expenses, y).filter(e => e.category === 'subscriptions'), r => r.amount);
    if (!s.all.length && !spentThisYear) return UNAVAILABLE('No subscriptions are tracked and nothing is categorised as a subscription expense.');
    return { title:'Subscriptions', body:
      list([['Active services', String(s.active.length)],['Cost per month', money(s.monthly)],['Cost per year', money(s.yearly)],
            [`Logged as subscription expenses in ${y}`, money(spentThisYear)]])
      + (s.active.length ? list(s.active.map(x => [x.service, `${money(x.amount)} ${x.cycle.toLowerCase()}`])) : '')
      + calc([`monthly equivalent = each amount converted to a monthly rate by its cycle`,
              `annual             = ${money(s.monthly)} × 12 = ${money(s.yearly)}`]) };
  }

  /* highest expense */
  if (/highest expense|biggest expense|largest expense|most expensive/.test(q)) {
    const scope = /year/.test(q) ? inY(S.expenses, y) : inYM(S.expenses, ym);
    if (!scope.length) return UNAVAILABLE(`No expenses are recorded for ${/year/.test(q) ? y : ymLabel(ym)}.`);
    const top = scope.slice().sort((a, b) => b.amount - a.amount).slice(0, 5);
    return { title:`Largest expenses · ${/year/.test(q) ? y : ymLabel(ym)}`, body:
      list(top.map(e => [`${e.description || catLabel(e.category)} — ${dateLabel(e.date)}`, money(e.amount)]))
      + calc([`highest = ${money(top[0].amount)} on ${dateLabel(top[0].date)} (${catLabel(top[0].category)})`,
              `that is ${pctStr(pct(top[0].amount, sum(scope, r => r.amount)), 1)} of the period's spending`]) };
  }

  /* increased */
  if (/increase|went up|rose|more than last/.test(q)) {
    const cats = categoryBreakdown(ym), pc = categoryBreakdown(shiftYM(ym, -1));
    const up = cats.map(c => ({ ...c, prev: pc.find(x => x.id === c.id)?.spent || 0 }))
      .map(c => ({ ...c, delta: c.spent - c.prev })).filter(c => c.delta > 0).sort((a, b) => b.delta - a.delta);
    if (!up.length) return { title:'Nothing increased', body:`<p>No category cost more in ${esc(ymLabel(ym))} than in ${esc(ymLabel(shiftYM(ym, -1)))}.</p>` };
    return { title:`What went up vs ${ymLabel(shiftYM(ym, -1))}`, body:
      list(up.map(c => [c.label, `+${money(c.delta).replace('₹','₹')} (${money(c.prev)} → ${money(c.spent)})`]))
      + calc([`total increase = ${money(sum(up, c => c.delta))}`]) };
  }

  /* share of income by category */
  const catMatch = CATEGORIES.find(c => q.includes(c.label.toLowerCase()));
  if (catMatch && /percent|% |share|proportion|went to/.test(q)) {
    const spent = sum(inYM(S.expenses, ym).filter(e => e.category === catMatch.id), r => r.amount);
    if (!m.income) return UNAVAILABLE(`No income is recorded for ${ymLabel(ym)}, so a share of income cannot be worked out.`);
    return { title:`${catMatch.label} as a share of income`, body:
      list([['Income', money(m.income)],[`${catMatch.label} spending`, money(spent)],['Share of income', pctStr(pct(spent, m.income))],
            ['Share of expenses', pctStr(pct(spent, m.expenses))]])
      + calc([`${pct(spent, m.income).toFixed(2)}% = ${money(spent)} ÷ ${money(m.income)} × 100`]) };
  }

  /* financial health */
  if (/health|how am i doing|summar/.test(q)) {
    const bs = balanceSheet(), d = debtSummary(), sub = subscriptionSummary(), dv = dailyView();
    if (!has && !bs.totalAssets) return UNAVAILABLE('There is not enough recorded yet to summarise.');
    const notes = [];
    if (m.income) notes.push(m.savingsRate >= 20 ? `You are keeping ${pctStr(m.savingsRate)} of what you earn.` : `You are keeping ${pctStr(m.savingsRate)} of what you earn this month.`);
    if (d.totalEmi && m.income) notes.push(`EMIs take ${pctStr(pct(d.totalEmi, m.income))} of your monthly income.`);
    if (sub.monthly) notes.push(`Subscriptions run at ${money(sub.monthly)} a month, ${money(sub.yearly)} a year.`);
    if (dv.smallCount >= 5) notes.push(`${dv.smallCount} small entries of ₹200 or less add up to ${money(dv.smallSpend)} this month.`);
    return { title:`Financial health · ${ymLabel(ym)}`, body:
      list([['Income', money(m.income)],['Expenses', money(m.expenses)],['Saved', money(m.savings)],['Savings rate', pctStr(m.savingsRate)],
            ['Net worth', money(bs.netWorth)],['Total debt', money(d.totalDebt)],['Debt to income', m.income ? pctStr(pct(d.totalEmi, m.income)) : '—'],
            ['Monthly subscriptions', money(sub.monthly)]])
      + (notes.length ? `<p style="margin-top:10px">${notes.map(esc).join(' ')}</p>` : '')
      + `<p style="margin-top:10px;font-size:.78rem;color:var(--muted)">A description of what you recorded, not financial advice.</p>` };
  }

  return null;
}

function runAsk(q) {

  const a = answerQuestion(q);
  const host = $('#askAnswer');

    host.innerHTML = `<div class="card"><div class="answer">
      <h4>Not one this app can answer offline</h4>
      <p>It answers factual questions about totals, budgets, categories, months, savings, net worth and subscriptions directly. For anything broader, copy the context bundle below into Cowork and ask Claude there — it will answer from those exact figures.</p>
      </div></div>`;
    return;
  }
  host.innerHTML = `<div class="card"><div class="answer"><h4>${esc(a.title)}</h4>${a.body}</div>
    <div class="help" style="margin-top:10px">Calculated from ${S.expenses.length} expense and ${S.income.length} income entries on this device.</div></div>`;
  host.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/** The scoped slice of data handed to Claude. Aggregated by default. */
function buildContext(scope) {
  const ym = UI.ym, y = UI.year, m = monthStats(ym), bs = balanceSheet();
  const base = {
    generatedAt: new Date().toISOString(),
    currency:'INR',
    scope,
    note:'Figures are calculated from the user’s own ledger. Do not invent values. If something is not here, say it is unavailable.',
  };
  if (scope === 'month') return {
    ...base, month: ym,
    income: m.income, expenses: m.expenses, savings: m.savings, savingsRate: +m.savingsRate.toFixed(2),
    budget: m.budget, budgetUsed: +m.budgetUsed.toFixed(2), budgetRemaining: m.budgetRemaining,
    transactionCount: m.txCount,
    byCategory: categoryBreakdown(ym).map(c => ({ category:c.label, spent:c.spent, share:+c.share.toFixed(2), count:c.count })),
    budgets: budgetStatus(ym).filter(b => b.budget).map(b => ({ category:b.label, budget:b.budget, actual:b.actual, used:+b.used.toFixed(2) })),
    spendingLimits: capStatus().map(c => ({ limit:c.label, amount:c.amount, spent:c.spent, over: c.over > 0 ? c.over : 0 })),
    largestExpenses: inYM(S.expenses, ym).slice().sort((a, b) => b.amount - a.amount).slice(0, 10)
      .map(e => ({ date:e.date, description:e.description || catLabel(e.category), category:catLabel(e.category), amount:e.amount })),
    previousMonth: (p => ({ month: shiftYM(ym, -1), income:p.income, expenses:p.expenses, savings:p.savings }))(monthStats(shiftYM(ym, -1))),
    cashFlow: cashFlow(ym),
    forecast: (f => ({ daysElapsed: f.elapsed, pacePerDay: Math.round(f.pace), projectedTotal: Math.round(f.projected), plan: f.plan }))(forecast(ym)),
    netWorth: bs.netWorth,
  };
  if (scope === 'year') {
    const a = annualStatement(y), er = annualExpenseReport(y), nw = netWorthHistory(y);
    return { ...base, year: y,
      months: a.rows.filter(r => r.hasData).map(r => ({ month:r.month, income:r.income, expenses:r.expenses, savings:r.savings, savingsRate:+r.savingsRate.toFixed(2), budget:r.budget })),
      totals: { income:a.totalIncome, expenses:a.totalExpenses, savings:a.savings, savingsRate:+a.savingsRate.toFixed(2),
                avgMonthlyIncome:Math.round(a.avgIncome), avgMonthlyExpenses:Math.round(a.avgExpenses) },
      byCategory: er.rows.map(r => ({ category:r.label, annual:r.spent, share:+r.share.toFixed(2), monthlyAverage:Math.round(r.monthlyAvg) })),
      netWorth: { start:nw.start, end:nw.end, change:nw.change, snapshots:nw.snaps.map(s => ({ month:s.ym, netWorth:s.netWorth })) },
      investments: investmentTotals(), debt: { total: sum(S.loans, l => l.outstanding), monthlyEmi: sum(S.loans, l => l.emi) },
      subscriptions: subscriptionSummary().monthly,
    };
  }
  return { ...base,
    years: yearsWithData().map(yr => { const a = annualStatement(yr); return { year:yr, income:a.totalIncome, expenses:a.totalExpenses, savings:a.savings, savingsRate:+a.savingsRate.toFixed(2) }; }),
    balanceSheet: { assets: bs.totalAssets, liabilities: bs.totalLiabilities, netWorth: bs.netWorth,
      assetLines: S.assets.map(a => ({ name:a.name, type:a.type, value:a.value })),
      liabilityLines: S.liabilities.map(l => ({ name:l.name, type:l.type, amount:l.amount })),
      loans: S.loans.map(l => ({ name:l.name, outstanding:l.outstanding, emi:l.emi, rate:l.interestRate })) },
    investments: S.investments.map(i => ({ name:i.name, type:i.type, invested:i.invested, currentValue:i.currentValue ?? i.invested })),
    goals: S.goals.map(g => ({ name:g.name, target:g.target, current:g.current, targetDate:g.targetDate })),
    subscriptions: S.subscriptions.map(s => ({ service:s.service, amount:s.amount, cycle:s.cycle, status:s.status })),
    monthlyTotals: allMonthsWithData().map(mm => { const s = monthStats(mm); return { month:mm, income:s.income, expenses:s.expenses, savings:s.savings }; }),
  };
}

/* ==========================================================================
   BACKUP, RESTORE AND EXPORT
   ========================================================================== */
/* Saving a file works two ways depending on where the app is running:
   as a normal web page a blob link is enough; inside the claude.ai artifact
   viewer the page must ask the host, which shows you a confirmation. */
let _dl = undefined;
async function downloadsApi() {
  if (_dl !== undefined) return _dl;
  try { _dl = (await window.claude?.use?.('downloads')) ?? null; } catch { _dl = null; }
  return _dl;
}
function blobSave(filename, content, type) {
  try {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    return true;
  } catch { return false; }
}
/** Returns true only if the file actually reached the device. */
async function download(filename, content, type = 'application/json') {
  const api = await downloadsApi();
  if (api) {
    try { await api.save({ filename, data: content }); toast(`Saved ${filename}`); return true; }
    catch (e) {
      const code = e?.code;
      if (code === 'declined') { toast('Save cancelled.'); return false; }
      if (code === 'rate_limited') { toast('A save is already open — try again in a moment.'); return false; }
      if (code === 'too_large') { toast('That file is too large to save from here. Export a single year instead.'); return false; }
      if ((code === 'extension_not_enabled' || code === 'rejected_extension') && typeof content === 'string') {
        const alt = filename.replace(/\.[^.]+$/, '.txt');
        try { await api.save({ filename: alt, data: content }); toast(`Saved as ${alt} — rename the extension to open it in a spreadsheet.`); return true; }
        catch (e2) { if (e2?.code === 'declined') { toast('Save cancelled.'); return false; } }
      }
    }
  }
  if (blobSave(filename, content, type)) { toast(`Downloaded ${filename}`); return true; }
  showRawFallback(filename, content);
  return false;
}
/** Last resort: put the contents on screen so nothing is ever trapped. */
function showRawFallback(filename, content) {
  openSheet({
    title:'Copy this out',
    body:`<p class="help" style="margin-bottom:10px">This view could not hand the file to your device. Select everything below and paste it into a file named <b>${esc(filename)}</b>. Nothing has been lost.</p>
      <textarea class="input" id="rawOut" style="min-height:220px;font-family:var(--font-mono);font-size:.7rem">${esc(content)}</textarea>`,
    footer:`<button class="btn ghost" data-cancel>Close</button><button class="btn primary" data-copy>Select all</button>`,
    onMount(sheet, close) {
      $('[data-cancel]', sheet).onclick = close;
      $('[data-copy]', sheet).onclick = () => { const t = $('#rawOut', sheet); t.focus(); t.select(); try { navigator.clipboard.writeText(t.value); toast('Copied.'); } catch { toast('Selected — copy it with your keyboard.'); } };
    },
  });
}

function buildBackup() {
  return {
    backupVersion: BACKUP_VERSION,
    createdAt: new Date().toISOString(),
    applicationVersion: APP_VERSION,
    meta: {
      transactionCount: S.expenses.length + S.income.length,
      expenseCount: S.expenses.length,
      incomeCount: S.income.length,
      coverage: (() => { const ms = allMonthsWithData(); return ms.length ? { from: ms[0], to: ms[ms.length - 1] } : null; })(),
      currency:'INR',
    },
    preferences: PREFS,
    /* Derived from the store list, so a new store can never be silently left
       out of a backup — that is exactly how recurring rules and categories
       went missing once. */
    data: Object.fromEntries(Object.keys(STORES).map(name => [name, S[name] || []])),
  };
}

async function doBackup() {
  const b = buildBackup();
  const saved = await download(`vishnu-tracker-backup-${todayISO()}.json`, JSON.stringify(b, null, 2));
  if (saved) { PREFS.lastBackupAt = b.createdAt; savePrefs(); render(); }
}

function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'That file is not readable as a backup.';
  if (!obj.backupVersion) return 'No backup version found — this does not look like a Vishnu Tracker backup.';
  if (!obj.data || typeof obj.data !== 'object') return 'The backup has no data section.';
  const major = String(obj.backupVersion).split('.')[0];
  if (+major > +BACKUP_VERSION.split('.')[0]) return `This backup was made by a newer version (${obj.backupVersion}). Update the app before restoring.`;
  for (const k of ['expenses','income']) if (obj.data[k] && !Array.isArray(obj.data[k])) return `The "${k}" section is malformed.`;
  return null;
}

async function handleRestoreFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); }
  catch { return alertDialog({ title:'Could not read that file', message:'It is not valid JSON. Choose a backup file exported from this app.', tone:'bad' }); }
  const err = validateBackup(obj);
  if (err) return alertDialog({ title:'That backup cannot be restored', message: esc(err), tone:'bad' });

  const d = obj.data;
  const months = [...new Set([...(d.expenses || []).map(e => e.ym), ...(d.income || []).map(i => i.ym)])].sort();
  const txCount = (d.expenses || []).length + (d.income || []).length;
  const coverage = months.length ? `${ymLabel(months[0])} – ${ymLabel(months[months.length - 1])}` : 'no dated transactions';

  const mode = await new Promise(resolve => {
    openSheet({
      title:'Restore backup',
      body:`<div class="d-facts" style="border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border)"><span>Backup created</span><span class="num">${esc(dateLabel(String(obj.createdAt || '').slice(0, 10)))}</span></div>
          <div style="display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border)"><span>Backup version</span><span class="num">${esc(obj.backupVersion)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border)"><span>Transactions</span><span class="num">${txCount.toLocaleString('en-IN')}</span></div>
          <div style="display:flex;justify-content:space-between;padding:9px 12px"><span>Covers</span><span>${esc(coverage)}</span></div>
        </div>
        <p class="help">This backup contains ${txCount.toLocaleString('en-IN')} transactions covering ${esc(coverage)}. Choose how to bring it in.</p>
        <div class="stack" style="margin-top:14px">
          <button class="qbtn" data-mode="merge"><b>Merge</b><br><span style="color:var(--muted);font-size:.8rem">Keep what is here and add anything from the backup that is missing. Records with the same id are overwritten by the backup.</span></button>
          <button class="qbtn" data-mode="replace"><b>Replace everything</b><br><span style="color:var(--muted);font-size:.8rem">Wipe this device's data first, then restore the backup exactly as it was.</span></button>
        </div>`,
      footer:`<button class="btn ghost" data-cancel>Cancel</button>`,
      onMount(sheet, close) {
        $('[data-cancel]', sheet).onclick = () => { close(); resolve(null); };
        $$('[data-mode]', sheet).forEach(b => b.onclick = () => { close(); resolve(b.dataset.mode); });
      },
    });
  });
  if (!mode) return;

  if (mode === 'replace') {
    const ok = await confirmDialog({
      title:'Replace all data on this device?', danger:true, tone:'bad', confirmLabel:'Replace everything', requireText:'REPLACE',
      message:`Everything currently stored here will be permanently removed and replaced with this backup. <b>If you have not exported a backup of what is here now, do that first.</b>`,
      facts:[['Currently stored', `${(S.expenses.length + S.income.length).toLocaleString('en-IN')} transactions`],
             ['Backup contains', `${txCount.toLocaleString('en-IN')} transactions`],['Covers', coverage]],
    });
    if (!ok) return;
    for (const s of Object.keys(STORES)) await DB.clear(s);
  } else {
    const ok = await confirmDialog({ title:'Merge this backup in?', tone:'info', confirmLabel:'Merge',
      message:`${txCount.toLocaleString('en-IN')} transactions covering ${esc(coverage)} will be added. Records that share an id with something already here will be overwritten by the backup.` });
    if (!ok) return;
  }

  for (const [store, rows] of Object.entries(d)) {
    if (!STORES[store] || !Array.isArray(rows)) continue;
    await DB.bulk(store, rows);
  }
  if (obj.preferences && mode === 'replace') { PREFS = { ...DEFAULT_PREFS, ...obj.preferences }; savePrefs(); }
  await reloadAll();
  await alertDialog({ title:'Restore complete', tone:'good',
    message:`Your data is back. Every total has been recalculated from the restored ledger.`,
    facts:[['Expenses', String(S.expenses.length)],['Income entries', String(S.income.length)],['Months covered', String(allMonthsWithData().length)]] });
  render();
}

    const income = sum(stats, s => s.income), expenses = sum(stats, s => s.expenses);
    obj = { report:'quarterly', quarter:key, income, expenses, savings: income - expenses, months: stats };
    name = `vishnu-tracker-${key}`;
    text = `VISHNU TRACKER — Q${qs} ${y}\n${'='.repeat(24)}\nIncome    ${money(income)}\nExpenses  ${money(expenses)}\nSaved     ${money(income - expenses)}\nRate      ${pctStr(pct(income - expenses, income))}`;
  } else {
    const y = key, a = annualStatement(y), er = annualExpenseReport(y), nw = netWorthHistory(y);
    obj = { report:'annual', year: y, totals: { income:a.totalIncome, expenses:a.totalExpenses, savings:a.savings, savingsRate:a.savingsRate },
            months: a.rows.filter(r => r.hasData), byCategory: er.rows, netWorth: nw };
    name = `vishnu-tracker-annual-${y}`;
    text = `VISHNU TRACKER — ANNUAL REVIEW ${y}\n${'='.repeat(34)}\n`
      + `Total income      ${money(a.totalIncome)}\nTotal expenses    ${money(a.totalExpenses)}\nTotal saved       ${money(a.savings)}\n`
      + `Savings rate      ${pctStr(a.savingsRate)}\nAvg monthly in    ${money(a.avgIncome)}\nAvg monthly out   ${money(a.avgExpenses)}\n`
      + `Net worth start   ${nw.snaps.length ? money(nw.start) : 'not recorded'}\nNet worth end     ${nw.snaps.length ? money(nw.end) : 'not recorded'}\n\nMONTHS\n`
      + a.rows.filter(r => r.hasData).map(r => `  ${r.month.padEnd(10)}${money(r.income).padStart(12)}${money(r.expenses).padStart(12)}${money(r.savings).padStart(12)}`).join('\n')
      + `\n\nBY CATEGORY\n` + er.rows.map(r => `  ${r.label.padEnd(18)}${money(r.spent).padStart(12)}  ${pctStr(r.share, 1).padStart(7)}  ${money(r.monthlyAvg)}/mo`).join('\n');
  }
  if (format === 'json') { await download(name + '.json', JSON.stringify(obj, null, 2)); }
  else if (format === 'csv') {
    const rows = kind === 'annual'
      ? [['Month','Income','Expenses','Savings','Savings rate','Budget'], ...annualStatement(key).rows.filter(r => r.hasData).map(r => [r.month, r.income, r.expenses, r.savings, r.savingsRate.toFixed(2), r.budget])]
      : [['Category','Amount','Share %'], ...categoryBreakdown(key).map(c => [c.label, c.spent, c.share.toFixed(2)])];
    await download(name + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv');
  } else {
    try { await navigator.clipboard.writeText(text); toast('Report copied to the clipboard.'); }
    catch { showRawFallback(name + '.txt', text); }
  }
}

async function clearMonth() {
  const ym = UI.ym, rows = inYM(S.expenses, ym), inc = inYM(S.income, ym);
  if (!rows.length && !inc.length) return toast(`Nothing recorded in ${ymLabel(ym)}.`);
  const ok = await confirmDialog({ title:`Delete everything in ${ymLabel(ym)}?`, danger:true, tone:'bad', confirmLabel:'Delete month',
    message:'All expenses and income for this month will be permanently removed from this device. Export a backup first if you are not sure.',
    facts:[['Expenses', String(rows.length)],['Income entries', String(inc.length)],['Total spending', money(sum(rows, r => r.amount))]] });
  if (!ok) return;
  for (const r of rows) await DB.del('expenses', r.id);
  for (const r of inc) await DB.del('income', r.id);
  await reloadAll(); toast(`${ymLabel(ym)} cleared.`); render();
}
async function clearYear() {
  const y = UI.year, rows = inY(S.expenses, y), inc = inY(S.income, y);
  if (!rows.length && !inc.length) return toast(`Nothing recorded in ${y}.`);
  const ok = await confirmDialog({ title:`Delete everything in ${y}?`, danger:true, tone:'bad', confirmLabel:'Delete year', requireText: y,
    message:'Every expense and income entry in this year will be permanently removed from this device.',
    facts:[['Expenses', String(rows.length)],['Income entries', String(inc.length)],['Total spending', money(sum(rows, r => r.amount))]] });
  if (!ok) return;
  for (const r of rows) await DB.del('expenses', r.id);
  for (const r of inc) await DB.del('income', r.id);
  await reloadAll(); toast(`${y} cleared.`); render();
}
async function clearAll() {
  const ok = await confirmDialog({
    title:'Clear all financial data?', danger:true, tone:'bad', confirmLabel:'Delete everything', requireText:'DELETE',
    message:'<b>All financial data will be permanently removed from this device.</b> Please create a backup before continuing — there is no way to recover this afterwards.',
    facts:[['Expenses', String(S.expenses.length)],['Income entries', String(S.income.length)],
           ['Last backup', PREFS.lastBackupAt ? dateLabel(PREFS.lastBackupAt.slice(0, 10)) : 'never']],
  });
  if (!ok) return;
  for (const s of Object.keys(STORES)) await DB.clear(s);
  PREFS.presets = []; savePrefs();
  await reloadAll(); updateBell(); toast('All data cleared.'); go('dashboard');
}

};
const NAV_ROUTES = ['dashboard','transactions','budget','reports','more'];

function go(route) {
  if (!SCREENS[route]) route = 'dashboard';
  UI.route = route;
  /* Sandboxed previews give the document an opaque origin, where any history
     call throws. The hash in the address bar is a convenience, not a feature —
     never let it take the app down with it. */
  try { history.replaceState(null, '', '#' + route); } catch {}
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function setYM(ym) { if (ym > shiftYM(currentYM(), 1)) return; UI.ym = ym; UI.year = ym.slice(0, 4); render(); }
function setYear(y) { UI.year = y; render(); }
function renderInto(sel, html) { const el = $(sel); if (el) el.innerHTML = html; }

function render() {
  const fn = SCREENS[UI.route] || screenDashboard;
  $('#view').innerHTML = fn();
  const [sub, title] = NAV_TITLES[UI.route] || ['','' ];
  $('#topSub').textContent = sub; $('#topTitle').textContent = title;
  $$('#nav button').forEach(b => {
    const active = b.dataset.route === UI.route || (b.dataset.route === 'more' && !NAV_ROUTES.includes(UI.route));
    active ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  updateBell();
}

async function editExpenseById(id) { const e = S.expenses.find(x => x.id === id); if (e) editExpense(e); }
async function editById(store, kind, id) {
  const rec = S[store].find(x => x.id === id); if (!rec) return;
  if (kind === 'income') return incomeSheet(rec);
  sheetFor[kind]?.(rec);
}

/* ---------------------------------------------------------------- install */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#installBtn'); if (b) b.hidden = false; });
function promptInstall() { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } else toast('Use your browser menu → Add to Home Screen.'); }

/** Re-attempt the proper database, carrying any fallback data across. */
async function retryStorage() {
  const before = STORAGE_MODE;
  toast('Checking for the full database…');
  BACKEND = null; STORAGE_MODE = 'none'; STORAGE_ERROR = '';
  try { await DB.open(); } catch {}
  await reloadAll();
  render();
  if (STORAGE_MODE === 'indexeddb') {
    await alertDialog({ tone:'good', title:'Full database is working',
      message:'This browser has given the app its proper storage, and anything saved in the fallback has been moved across.',
      facts:[['Storage', 'IndexedDB'],['Expenses', String(S.expenses.length)],['Income entries', String(S.income.length)]] });
  } else if (before === STORAGE_MODE) {
    toast('Still on backup storage — try opening the site in Safari directly.');
  }
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  loadPrefs();
  if (PREFS.theme !== 'system') document.documentElement.setAttribute('data-theme', PREFS.theme);

  await guardLock();
  armAutoLock();

  await DB.open();
  await reloadAll();
  await seedCategories();
  await rollSubscriptions();
  await reloadAll();

  /* Net worth needs a snapshot for the current month if the sheet has content. */
  const bs = balanceSheet();
  if ((bs.totalAssets || bs.totalLiabilities) && !S.netWorth.some(n => n.ym === currentYM())) await snapshotNetWorth();

  let hash = '';
  try { hash = location.hash.replace('#', ''); } catch {}
  if (SCREENS[hash]) UI.route = hash;

  render();
  await runRecurring();
  await runNotificationRules();
  render();

  /* backup reminder */
  if (PREFS.autoBackupDays > 0) {
    const last = PREFS.lastBackupAt ? daysBetween(PREFS.lastBackupAt.slice(0, 10), todayISO()) : 999;
    if (last >= PREFS.autoBackupDays && (S.expenses.length || S.income.length)) {
      setTimeout(() => toast('It has been a while since your last backup.', { label:'Back up', fn: doBackup }), 1400);
    }
  }

  setInterval(() => runNotificationRules().catch(() => {}), 60 * 60 * 1000);
}

/* --------------------------------------------------------------- wiring */
$('#fab').onclick = () => addExpenseSheet();
$('#btnBell').onclick = () => go('notifications');
$('#btnSearch').onclick = () => go('search');
$('#btnTheme').onclick = () => {
  const order = ['system','light','dark'];
  setTheme(order[(order.indexOf(PREFS.theme) + 1) % 3]);
  toast(`Theme: ${PREFS.theme}`);
};
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-route]');
  if (b) go(b.dataset.route);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeTopSheet();
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); addExpenseSheet(); }
  if (e.key === '/') { e.preventDefault(); go('search'); setTimeout(() => $('#gq')?.focus(), 80); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'restoreFile' && e.target.files?.[0]) { handleRestoreFile(e.target.files[0]); e.target.value = ''; }
});

/* ---------------------------------------------------------------- zoom lock
   iOS Safari ignores user-scalable=no, so pinch and double-tap zoom have to be
   refused at the gesture level. Without this the whole layout drifts out of
   alignment and the fixed dock appears to float away from the screen edge. */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();   // double-tap zoom
  lastTouchEnd = now;
}, { passive: false });
/* If a zoom slips through anyway, snap the page back to 1× on release. */
window.visualViewport?.addEventListener('resize', () => {
  if (window.visualViewport.scale > 1.01) window.scrollTo(window.scrollX, window.scrollY);
});

/* ------------------------------------------------------- service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* not hosted as a PWA — the app still works fully */ });
  });
}

boot().catch(err => {
  console.error(err);
  $('#view').innerHTML = `<div class="screen"><div class="card"><div class="empty">
    <div class="e-ic">⚠️</div><div class="e-t">This view is blocking all local storage</div>
    <div class="e-s">Every way of saving data on this device has been refused — usually because the page is running inside another app, or the browser is in private mode. Open the app directly in Safari or Chrome, or host the standalone build yourself, and it will work.</div>
  </div></div></div>`;
});

</script>
</body>
</html>
