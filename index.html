<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7A2F52" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141115" media="(prefers-color-scheme: dark)">
<meta name="description" content="Local-first personal finance management system. Your data never leaves this device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vishnu Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<title>Vishnu Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   VISHNU TRACKER — design tokens
   Palette: warm plum ink accent on faintly plum-biased paper,
   with semantic traffic colours kept deliberately separate.
   Type: Newsreader (display) / IBM Plex Sans (UI) / IBM Plex Mono (figures)
   ============================================================ */
:root{
  --ground:#FBF8F9;
  --surface:#FFFFFF;
  --surface-2:#F5F1F3;
  --surface-3:#EDE6EA;
  --border:#E7DFE3;
  --border-strong:#D6CAD0;
  --text:#1D181B;
  --text-2:#4A4146;
  --muted:#786C72;
  --accent:#7A2F52;          /* fill: buttons, bars, chart ink */
  --accent-hover:#652643;
  --accent-ink:#FFFFFF;      /* text ON the fill */
  --accent-text:#7A2F52;     /* accent used AS text on the page ground */
  --accent-soft:#F5E7ED;
  --accent-line:#E3C9D6;
  --hero-from:#7A2F52;
  --hero-to:#5C2340;
  --hero-ink:#FFFFFF;
  --viz:#7A2F52;             /* chart and progress fill */
  --viz-ink:#FFFFFF;         /* text on a saturated viz fill */
  --good:#186E48;
  --good-soft:#E4F2EA;
  --warn:#9E5B06;
  --warn-soft:#FBEEDC;
  --bad:#A82A20;
  --bad-soft:#FBE7E4;
  --info:#3A4C7A;
  --shadow-sm:0 1px 2px rgba(29,24,27,.06),0 1px 3px rgba(29,24,27,.05);
  --shadow-md:0 4px 14px rgba(29,24,27,.08);
  --shadow-lg:0 12px 40px rgba(29,24,27,.16);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --nav-h:62px;
  --dock-h:130px;   /* action row + tab row, excluding the safe area */
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ground:#141115;
    --surface:#1D181C;
    --surface-2:#251F24;
    --surface-3:#2F272D;
    --border:#332B31;
    --border-strong:#463A41;
    --text:#F3EDF0;
    --text-2:#D2C7CD;
    --muted:#9E9098;
    --accent:#8E3A60;
    --accent-hover:#A24571;
    --accent-ink:#FFFFFF;
    --accent-text:#E9A8C5;
    --accent-soft:#33202B;
    --accent-line:#4E3040;
    --hero-from:#4A2039;
    --hero-to:#301425;
    --hero-ink:#F7E8F0;
    --viz:#E9A8C5;
    --viz-ink:#2A1020;
    --good:#5CCB92;
    --good-soft:#16301F;
    --warn:#E9A63F;
    --warn-soft:#33240F;
    --bad:#F0796B;
    --bad-soft:#3A1A16;
    --info:#9BB0E5;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#141115;
  --surface:#1D181C;
  --surface-2:#251F24;
  --surface-3:#2F272D;
  --border:#332B31;
  --border-strong:#463A41;
  --text:#F3EDF0;
  --text-2:#D2C7CD;
  --muted:#9E9098;
  --accent:#8E3A60;          /* a fill that carries white text, as in light mode */
  --accent-hover:#A24571;
  --accent-ink:#FFFFFF;
  --accent-text:#E9A8C5;     /* the light pink is for text and icons only */
  --accent-soft:#33202B;
  --accent-line:#4E3040;
  --hero-from:#4A2039;
  --hero-to:#301425;
  --hero-ink:#F7E8F0;
  --viz:#E9A8C5;
  --viz-ink:#2A1020;
  --good:#5CCB92;
  --good-soft:#16301F;
  --warn:#E9A63F;
  --warn-soft:#33240F;
  --bad:#F0796B;
  --bad-soft:#3A1A16;
  --info:#9BB0E5;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--font-ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
/* Chrome elements must never be draggable, selectable or long-press-callable —
   on iOS that is what makes a fixed bar feel like it is coming loose. */
.dock,.topbar,.fab,.nav,.icon-btn,.chip,.opt,.pill,.row-ic,.heat button,.lock-pad button{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  -webkit-user-drag:none;
}
button,a,input,select,textarea{touch-action:manipulation}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--accent-text)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- app shell ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:1.22rem;letter-spacing:-.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-2);position:relative;flex:none;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn:disabled{opacity:.22;cursor:default}
.icon-btn:disabled:hover{background:none}
.icon-btn svg{width:20px;height:20px;stroke-width:1.75}
.badge-dot{
  position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;
  background:var(--bad);color:#fff;border-radius:9px;font-size:.6rem;font-weight:700;
  display:grid;place-items:center;font-family:var(--font-mono);
  border:2px solid var(--ground);
}
main{flex:1;padding:14px 16px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom));max-width:1180px;width:100%;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow-sm);
}
.card.tight{padding:12px}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-title{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card-head .spacer{flex:1}
.card-action{font-size:.78rem;font-weight:600;color:var(--accent-text)}
.section-title{font-family:var(--font-display);font-size:1.32rem;font-weight:600;letter-spacing:-.015em}
.section-note{font-size:.82rem;color:var(--muted);line-height:1.45}

/* ---------- hero figure ---------- */
.hero{
  background:linear-gradient(152deg,var(--hero-from) 0%,var(--hero-to) 100%);
  color:var(--hero-ink);border-radius:var(--r-xl);padding:20px;
  box-shadow:var(--shadow-md);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:auto -40px -70px auto;width:210px;height:210px;
  border-radius:50%;background:rgba(255,255,255,.07);
}
.hero-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;opacity:.78}
.hero-figure{font-family:var(--font-display);font-size:2.5rem;font-weight:600;line-height:1.05;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin-top:16px;position:relative;z-index:1}
.hero-meta > div{min-width:0}
.hero-meta .k,.hero-meta .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-meta .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:700}
.hero-meta .v{font-family:var(--font-mono);font-size:.95rem;font-weight:600;margin-top:1px}

/* ---------- stat grid ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px}
.stat .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--font-mono);font-size:1.14rem;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.stat .s{font-size:.72rem;color:var(--muted);margin-top:2px}
.v.good{color:var(--good)} .v.bad{color:var(--bad)} .v.warn{color:var(--warn)}

/* ---------- progress ---------- */
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--viz);transition:width .4s ease}
.bar.g > i{background:var(--good)} .bar.o > i{background:var(--warn)} .bar.r > i{background:var(--bad)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--border-strong)}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.o{background:var(--warn-soft);color:var(--warn)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.n{background:var(--surface-2);color:var(--muted)}
.pill.a{background:var(--accent-soft);color:var(--accent-text)}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:0 18px 2px 0;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
.chipbar::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  font-size:.8rem;font-weight:600;color:var(--text-2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- rows / list ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);
  text-align:left;width:100%;background:none}
.rows .row:last-child{border-bottom:none}
button.row:hover{background:var(--surface-2)}
.row-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;
  flex:none;font-size:.98rem}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-r{text-align:right;flex:none}
.row-a{font-family:var(--font-mono);font-weight:600;font-size:.92rem;letter-spacing:-.02em}
.row-b{font-size:.7rem;color:var(--muted);margin-top:1px}
.daygroup{padding:9px 14px 5px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center}

/* ---------- empty ---------- */
.empty{text-align:center;padding:26px 18px;color:var(--muted)}
.empty .e-ic{font-size:1.7rem;opacity:.5;margin-bottom:8px}
.empty .e-t{font-weight:600;color:var(--text-2);font-size:.9rem}
.empty .e-s{font-size:.8rem;margin-top:4px;line-height:1.5;max-width:34ch;margin-inline:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;
  border-radius:var(--r-md);font-weight:600;font-size:.88rem;border:1px solid transparent;transition:.15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.subtle{background:var(--surface-2);color:var(--text-2)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:130px}
.btnrow.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btnrow.tri .btn{min-width:0;padding:9px 6px;font-size:.78rem}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.input,select.input,textarea.input{
  width:100%;padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-size:1rem;transition:.15s;
}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:72px;resize:vertical;font-size:.92rem}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.help{font-size:.74rem;color:var(--muted);line-height:1.45}
.err{font-size:.74rem;color:var(--bad);font-weight:600}
.optbar{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-size:.82rem;font-weight:600;color:var(--text-2)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}

/* amount entry */
.amount-wrap{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-lg);
  padding:14px 16px;border:1px solid var(--border)}
.amount-wrap .cur{font-family:var(--font-display);font-size:1.7rem;color:var(--muted);font-weight:600}
.amount-in{flex:1;min-width:0;border:none;background:none;font-family:var(--font-mono);font-size:2rem;font-weight:600;
  letter-spacing:-.03em;padding:0;width:100%}
.amount-in:focus{outline:none}
.amount-in::-webkit-outer-spin-button,.amount-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-in[type=number]{-moz-appearance:textfield}

/* ---------- fixed bottom dock: action row + tab row ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 0 rgba(0,0,0,.02),0 -6px 20px rgba(29,24,27,.06);
}
:root[data-theme="dark"] .dock{box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.dock-action{padding:10px 16px 8px}
.fab{
  width:100%;height:50px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:700;font-size:.95rem;letter-spacing:.01em;
}
.fab svg{width:20px;height:20px;stroke-width:2.4}
.fab:active{transform:scale(.985);background:var(--accent-hover)}
.nav{
  height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--border);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:.63rem;font-weight:600;letter-spacing:.02em;position:relative;
  min-width:0;padding:0 2px;
}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button svg{width:21px;height:21px;stroke-width:1.7;flex:none}
.nav button > *{position:relative;z-index:1}
.nav button[aria-current="page"]{color:var(--accent-text)}
.nav button[aria-current="page"]::before{
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:46px;height:27px;border-radius:99px;background:var(--accent-soft);z-index:0;
}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,15,18,.55);z-index:100;opacity:0;transition:opacity .2s;
  backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92dvh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow-lg);
}

.sheet.on{transform:none}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:14px 18px 10px;z-index:2;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-head h3{font-family:var(--font-display);font-size:1.16rem;font-weight:600;flex:1}
.sheet-body{padding:16px 18px 18px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:2}
.sheet-foot .btn{flex:1}
.grab{width:36px;height:4px;border-radius:99px;background:var(--border-strong);margin:8px auto 0}

/* ---------- toast ---------- */
.toasts{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + 14px + env(safe-area-inset-bottom));z-index:120;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--ground);padding:11px 15px;border-radius:var(--r-md);
  font-size:.85rem;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;
  max-width:460px;width:100%;pointer-events:auto;animation:pop .22s ease}
.toast button{color:var(--ground);font-weight:700;text-decoration:underline;font-size:.82rem;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- alert dialog (cap breach) ---------- */
.dialog{position:fixed;z-index:130;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;
  width:min(440px,calc(100vw - 32px));background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);padding:22px;transition:.2s;border:1px solid var(--border)}
.dialog.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dialog .d-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:12px}
.dialog h3{font-family:var(--font-display);font-size:1.28rem;font-weight:600;margin-bottom:7px}
.dialog p{font-size:.9rem;color:var(--text-2);line-height:1.55}
.dialog .d-facts{margin:14px 0;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.dialog .d-facts div{display:flex;justify-content:space-between;padding:9px 12px;font-size:.84rem;border-bottom:1px solid var(--border)}
.dialog .d-facts div:last-child{border:none}
.dialog .d-facts span:last-child{font-family:var(--font-mono);font-weight:600}

/* ---------- table ---------- */
.only-wide{display:none}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.83rem}
th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;
  background:var(--surface-2);border-bottom:1px solid var(--border-strong)}
thead th:first-child{background:var(--surface-2)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:hover td:first-child{background:var(--surface-2)}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border-strong)}
tfoot td:first-child{background:var(--surface-2)}
tr.now td{background:var(--accent-soft)}
tr.now td:first-child{background:var(--accent-soft)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;max-height:230px}
.chart text{font-family:var(--font-ui);fill:var(--muted);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- notifications ---------- */
.notif{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--border);align-items:flex-start;
  width:100%;text-align:left;background:none}
.notif.unread{background:var(--accent-soft)}
.notif .n-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:.9rem}
.notif .n-t{font-weight:600;font-size:.86rem}
.notif .n-b{font-size:.8rem;color:var(--text-2);margin-top:2px;line-height:1.45}
.notif .n-d{font-size:.7rem;color:var(--muted);margin-top:4px}

/* ---------- ask claude ---------- */
.ask-hero{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r-xl);padding:18px;
  box-shadow:var(--shadow-sm)}
.qbtn{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);font-size:.87rem;font-weight:500;margin-bottom:8px;
  color:var(--text);transition:.15s}
.qbtn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.answer{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;
  font-size:.88rem;line-height:1.6}
.answer h4{font-size:.95rem;margin-bottom:6px;font-family:var(--font-display);font-weight:600}
.answer .calc{font-family:var(--font-mono);font-size:.76rem;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;margin-top:9px;color:var(--text-2);white-space:pre-wrap;overflow-x:auto;line-height:1.6}
.answer ul{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.answer li{display:flex;justify-content:space-between;gap:14px;font-size:.84rem;border-bottom:1px dashed var(--border);padding-bottom:4px}
.answer li b{font-family:var(--font-mono);font-weight:600}
pre.ctx{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;
  font-family:var(--font-mono);font-size:.68rem;max-height:230px;overflow:auto;line-height:1.55;color:var(--text-2)}

/* ---------- misc ---------- */
.split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.disclaim{font-size:.74rem;color:var(--muted);line-height:1.5;background:var(--surface-2);
  border-left:2px solid var(--border-strong);padding:9px 11px;border-radius:0 8px 8px 0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:.87rem}
.kv:last-child{border:none}
.kv b{font-family:var(--font-mono);font-weight:600}
.kv.total{border-top:2px solid var(--border-strong);border-bottom:none;margin-top:4px;padding-top:11px;font-weight:700}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-md);padding:9px 12px}
.searchbar input{flex:1;border:none;background:none;font-size:.92rem}
.searchbar input:focus{outline:none}
.morelist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.morecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 12px;
  display:flex;flex-direction:column;gap:6px;text-align:left;transition:.15s}
.morecard:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.morecard .m-ic{font-size:1.15rem}
.morecard .m-t{font-weight:600;font-size:.86rem}
.morecard .m-s{font-size:.72rem;color:var(--muted);line-height:1.35}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:11px}
.tabs button{flex:1;padding:8px 6px;border-radius:9px;font-size:.79rem;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- lock screen ---------- */
#lockScreen{position:fixed;inset:0;z-index:200;background:var(--ground);display:grid;place-items:center;
  padding:24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
.lock-wrap{width:min(320px,100%);text-align:center}
.lock-wrap.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.lock-mark{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--font-display);font-size:2rem;font-weight:600;box-shadow:var(--shadow-md)}
.lock-title{font-family:var(--font-display);font-size:1.32rem;font-weight:600}
.lock-sub{font-size:.84rem;color:var(--muted);margin-top:4px;min-height:1.3em}
.lock-dots{display:flex;gap:11px;justify-content:center;margin:22px 0 26px}
.lock-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border-strong);transition:.15s}
.lock-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
.lock-pad button{width:100%;max-width:72px;aspect-ratio:1;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--border);font-family:var(--font-mono);font-size:1.4rem;font-weight:500;color:var(--text);
  transition:.12s;display:grid;place-items:center}
.lock-pad button:active{background:var(--accent-soft);transform:scale(.94)}
.lock-pad button[data-k="del"],.lock-pad button[data-k="face"]{background:none;border-color:transparent;color:var(--muted)}
.lock-pad button svg{width:26px;height:26px;stroke-width:1.6}
.lock-pad button[data-k="face"] svg{color:var(--accent-text)}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .hd{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.heat button,.heat span.blank{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:.66rem;color:var(--text-2);background:var(--surface-2);border:1px solid transparent}
.heat span.blank{background:none}
.heat button.future{opacity:.35}
.heat button.today{border-color:var(--accent);font-weight:700}
.heat button.hot{color:var(--viz-ink)}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted);margin-top:10px;justify-content:flex-end}
.heat-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ---------- desktop ---------- */
@media(min-width:900px){
  body{font-size:15.5px}
  .dock{top:0;bottom:0;left:0;right:auto;width:232px;height:100vh;border-top:none;
    border-right:1px solid var(--border);padding:74px 12px 12px;box-shadow:none;
    display:flex;flex-direction:column;gap:10px}
  .dock-action{padding:0}
  .fab{height:44px;border-radius:11px;font-size:.9rem}
  .nav{height:auto;grid-template-columns:1fr;grid-auto-rows:max-content;gap:3px;border-top:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:11px;padding:10px 13px;border-radius:10px;font-size:.88rem}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .nav button[aria-current="page"]::before{display:none}
  .topbar{padding-left:248px;background:var(--surface);z-index:60}
  main{padding-left:264px;padding-right:28px;padding-bottom:60px;max-width:1240px;margin:0}
  .stats{grid-template-columns:repeat(4,1fr)}
  .hero-meta{grid-template-columns:repeat(4,1fr)}
  .stats.three{grid-template-columns:repeat(3,1fr)}
  .dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
  .dash-grid > *{min-width:0}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;
    width:min(560px,calc(100vw - 40px));border-radius:var(--r-xl);max-height:86vh}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .toasts{left:auto;right:24px;bottom:24px;align-items:flex-end}
  .dock{z-index:60}
  .morelist{grid-template-columns:repeat(4,1fr)}
  .only-wide{display:block}
  .only-narrow{display:none}
  .tablewrap{-webkit-mask-image:none;mask-image:none}
  table{min-width:0}
}
</style>

</head>
<body>
<div id="app">
  <header class="topbar">
    <div style="flex:1;min-width:0">
      <div class="topbar-sub" id="topSub">Vishnu Tracker</div>
      <div class="topbar-title" id="topTitle">Dashboard</div>
    </div>
    <button class="icon-btn" id="btnSearch" aria-label="Search everything">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="btnBell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge-dot" id="bellCount" hidden>0</span>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </header>

  <main id="view" role="main"><div class="screen"></div></main>

  <!-- One fixed dock holds the primary action and the tabs, so nothing floats
       over the content and everything lines up on the same grid. -->
  <div class="dock" id="dock">
    <div class="dock-action">
      <button class="fab" id="fab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add expense</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Primary">
      <button data-route="dashboard" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Dashboard</span>
      </button>
      <button data-route="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg><span>Activity</span>
      </button>
      <button data-route="budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 12V4a8 8 0 0 1 8 8Z"/></svg><span>Budget</span>
      </button>
      <button data-route="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V9"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg><span>Reports</span>
      </button>
      <button data-route="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg><span>More</span>
      </button>
    </nav>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalHost"></div>
</div>

<script>
/* ===== 03-core.js ===== */
/* ============================================================================
   VISHNU TRACKER — Personal Finance Management System
   Version 1.0 — local-first. All data lives in this browser's IndexedDB.
   Nothing is uploaded anywhere. No API keys. No network calls at runtime.
   ========================================================================== */
const APP_VERSION = '1.3.1';
const DB_NAME = 'ledger-cfo';
const DB_VERSION = 3;
const BACKUP_VERSION = '1.1';

/* ---------------------------------------------------------------- constants */
/* Categories are data, not code — you can rename, reorder, hide and add your
   own. The eleven below are only what a fresh install starts with. Two ids are
   load-bearing and cannot be removed: `investments` and `emi`, because the cash
   flow statement keeps those out of living expenses so nothing is counted twice. */
const PROTECTED_CATS = ['investments', 'emi', 'other'];
const DEFAULT_CATEGORIES = [
  { id:'housing',        label:'Housing',        icon:'🏠', order:0 },
  { id:'food',           label:'Food',           icon:'🍽️', order:1 },
  { id:'transportation', label:'Transportation', icon:'🚗', order:2 },
  { id:'shopping',       label:'Shopping',       icon:'🛍️', order:3 },
  { id:'entertainment',  label:'Entertainment',  icon:'🎬', order:4 },
  { id:'health',         label:'Health',         icon:'🩺', order:5 },
  { id:'education',      label:'Education',      icon:'📚', order:6 },
  { id:'emi',            label:'EMI',            icon:'🏦', order:7 },
  { id:'subscriptions',  label:'Subscriptions',  icon:'🔁', order:8 },
  { id:'investments',    label:'Investments',    icon:'📈', order:9 },
  { id:'other',          label:'Other',          icon:'•',  order:10 },
];
/** Every category, hidden ones included — used to resolve old entries' labels. */
let ALL_CATS = DEFAULT_CATEGORIES.slice();
/** What pickers offer: visible, in your order. */
let CATEGORIES = DEFAULT_CATEGORIES.slice();
let CAT = Object.fromEntries(ALL_CATS.map(c => [c.id, c]));
const catLabel = id => (CAT[id] || { label:'Removed category' }).label;
const catIcon  = id => (CAT[id] || { icon:'•' }).icon;
function applyCategories(rows) {
  ALL_CATS = (rows?.length ? rows : DEFAULT_CATEGORIES).slice()
    .sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.label.localeCompare(b.label));
  CATEGORIES = ALL_CATS.filter(c => !c.hidden);
  CAT = Object.fromEntries(ALL_CATS.map(c => [c.id, c]));
}

const PAYMENT_METHODS = ['UPI','Cash','Debit Card','Credit Card','Bank Transfer','Other'];
const INCOME_TYPES    = ['Salary','Freelance','Business','Interest','Rental','Bonus','Other'];
const INVEST_TYPES    = ['Stocks','Mutual Funds','FD','PPF','NPS','Gold','Real Estate','Other'];
const ASSET_TYPES     = ['Cash','Bank Account','Savings','Investments','Fixed Deposit','Gold','Other'];
const LIAB_TYPES      = ['Credit Card Outstanding','Personal Loan','Vehicle Loan','Education Loan','Home Loan','Other'];
const GOAL_TYPES      = ['Emergency Fund','Vacation','Vehicle','Education','Home','Other'];
const CYCLES          = ['Weekly','Monthly','Quarterly','Half-Yearly','Yearly'];
const NOTIF_CATEGORIES = [
  { id:'bills',         label:'Bills',        icon:'🧾' },
  { id:'emi',           label:'EMI',          icon:'🏦' },
  { id:'subscriptions', label:'Subscriptions',icon:'🔁' },
  { id:'budget',        label:'Budget',       icon:'📊' },
  { id:'savings',       label:'Savings',      icon:'🎯' },
  { id:'reports',       label:'Reports',      icon:'📄' },
  { id:'insights',      label:'AI Insights',  icon:'✨' },
];

/* -------------------------------------------------------------------- utils */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const sum = (arr, f = x => x) => arr.reduce((t, x) => t + (Number(f(x)) || 0), 0);

/** Zero-safe percentage. Returns 0 when the denominator is missing or zero. */
const pct = (part, whole) => (Number(whole) > 0 ? (Number(part) / Number(whole)) * 100 : 0);
/** Zero-safe ratio for growth: null when there is no baseline to grow from. */
const growth = (now, before) => (Number(before) !== 0 ? ((now - before) / Math.abs(before)) * 100 : null);

const money = (n, opts = {}) => {
  const v = Number(n) || 0;
  const s = Math.abs(v).toLocaleString('en-IN', { maximumFractionDigits: opts.dec ?? 0, minimumFractionDigits: opts.dec ?? 0 });
  return (v < 0 ? '−₹' : '₹') + s;
};
const trimZeros = s => s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
const moneyShort = n => {
  const v = Math.abs(Number(n) || 0), sign = (Number(n) || 0) < 0 ? '−' : '';
  if (v >= 1e7) return sign + '₹' + trimZeros((v / 1e7).toFixed(v >= 1e8 ? 0 : 2)) + ' Cr';
  if (v >= 1e5) return sign + '₹' + trimZeros((v / 1e5).toFixed(v >= 1e6 ? 1 : 2)) + ' L';
  if (v >= 1e3) return sign + '₹' + trimZeros((v / 1e3).toFixed(v >= 1e4 ? 0 : 1)) + 'k';
  return sign + '₹' + Math.round(v);
};
const pctStr = (n, dec = 1) => (Number.isFinite(n) ? n.toFixed(dec) + '%' : '—');

/* --------------------------------------------------------------------- dates */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const ymOf = iso => (iso || '').slice(0, 7);
const yOf  = iso => (iso || '').slice(0, 4);
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${MONTHS[+m - 1]} ${y}`; };
const ymShort = ym => { const [y, m] = ym.split('-'); return `${MON3[+m - 1]} ${y.slice(2)}`; };
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const currentYM = () => todayISO().slice(0, 7);
const shiftYM = (ym, delta) => {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
};
const dateLabel = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${+d} ${MON3[+m - 1]} ${y}`;
};
const dayLabel = iso => {
  const t = todayISO();
  if (iso === t) return 'Today';
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if (iso === `${yest.getFullYear()}-${pad2(yest.getMonth()+1)}-${pad2(yest.getDate())}`) return 'Yesterday';
  const d = new Date(iso + 'T00:00:00');
  return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${+iso.slice(8)} ${MON3[+iso.slice(5,7) - 1]}`;
};
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const addDaysISO = (iso, n) => {
  const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
};
const advanceCycle = (iso, cycle) => {
  const d = new Date(iso + 'T00:00:00');
  ({ Weekly:      () => d.setDate(d.getDate() + 7),
     Monthly:     () => d.setMonth(d.getMonth() + 1),
     Quarterly:   () => d.setMonth(d.getMonth() + 3),
     'Half-Yearly': () => d.setMonth(d.getMonth() + 6),
     Yearly:      () => d.setFullYear(d.getFullYear() + 1) }[cycle] || (() => d.setMonth(d.getMonth() + 1)))();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
};
const cycleToMonthly = (amount, cycle) => {
  const f = { Weekly: 52 / 12, Monthly: 1, Quarterly: 1 / 3, 'Half-Yearly': 1 / 6, Yearly: 1 / 12 }[cycle] ?? 1;
  return (Number(amount) || 0) * f;
};

/* ==========================================================================
   DATA LAYER — IndexedDB
   One object store per entity. Expenses and income are indexed by day, month
   and year so a query never has to scan the whole history. Everything the UI
   shows is derived from these stores at read time; no total is ever stored.
   ========================================================================== */
const STORES = {
  expenses:      { key:'id', idx:{ date:'date', ym:'ym', y:'y', category:'category' } },
  income:        { key:'id', idx:{ date:'date', ym:'ym', y:'y', type:'type' } },
  budgets:       { key:'id', idx:{ ym:'ym', y:'y' } },
  caps:          { key:'id' },
  bills:         { key:'id', idx:{ dueDate:'dueDate' } },
  subscriptions: { key:'id', idx:{ nextBillingDate:'nextBillingDate' } },
  investments:   { key:'id', idx:{ type:'type' } },
  assets:        { key:'id', idx:{ type:'type' } },
  liabilities:   { key:'id', idx:{ type:'type' } },
  loans:         { key:'id' },
  goals:         { key:'id' },
  notifications: { key:'id', idx:{ createdAt:'createdAt', category:'category' } },
  recurring:     { key:'id' },
  categories:    { key:'id' },
  netWorth:      { key:'ym' },
  monthlySummaries: { key:'ym' },
  annualSummaries:  { key:'y' },
};

/* Three storage backends, tried in order. IndexedDB is the real one; the
   others exist because embedded browser views (notably Safari inside an
   iframe on another site) refuse cross-site storage, and losing the whole app
   to that is worse than running degraded and saying so out loud. */
let STORAGE_MODE = 'none';
let STORAGE_ERROR = '';
const STORAGE_LABEL = { indexeddb:'IndexedDB (this device)', localstorage:'Browser local storage', memory:'Memory only — nothing is being saved', none:'Unavailable' };

/* ---- backend 1: IndexedDB ---- */
const IDB = {
  _db: null,
  /** One attempt. WebKit sometimes leaves open() hanging with no event at all,
      which is why this races a timeout rather than trusting the callbacks. */
  _attempt(ms) {
    return new Promise((res, rej) => {
      let settled = false;
      const finish = (fn, v) => { if (!settled) { settled = true; clearTimeout(timer); fn(v); } };
      const timer = setTimeout(() => finish(rej, new Error('indexedDB did not respond')), ms);
      let rq;
      try { rq = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { return finish(rej, e); }
      rq.onupgradeneeded = e => {
        const db = e.target.result;
        for (const [name, def] of Object.entries(STORES)) {
          if (db.objectStoreNames.contains(name)) continue;
          const os = db.createObjectStore(name, { keyPath: def.key });
          for (const [ix, path] of Object.entries(def.idx || {})) os.createIndex(ix, path, { unique: false });
        }
      };
      rq.onsuccess = () => finish(res, rq.result);
      rq.onerror = () => finish(rej, rq.error || new Error('indexedDB refused'));
      rq.onblocked = () => finish(rej, new Error('indexedDB blocked'));
    });
  },
  async init() {
    if (typeof indexedDB === 'undefined' || !indexedDB) throw new Error('no indexedDB');
    /* Three goes with growing patience: a hung first open is a known iOS bug
       and usually clears on the retry. */
    let last;
    for (const ms of [1500, 3000, 6000]) {
      try { this._db = await this._attempt(ms); return this; }
      catch (e) { last = e; await new Promise(r => setTimeout(r, 250)); }
    }
    throw last;
  },
  all(store) {
    return new Promise((res, rej) => {
      const rq = this._db.transaction(store, 'readonly').objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  get(store, key) {
    return new Promise((res, rej) => {
      const rq = this._db.transaction(store, 'readonly').objectStore(store).get(key);
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  },
  write(store, fn) {
    return new Promise((res, rej) => {
      const t = this._db.transaction(store, 'readwrite');
      fn(t.objectStore(store));
      t.oncomplete = () => res(true); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(store, obj)   { return this.write(store, os => os.put(obj)).then(() => obj); },
  del(store, key)   { return this.write(store, os => os.delete(key)); },
  clear(store)      { return this.write(store, os => os.clear()); },
  bulk(store, rows) { return rows?.length ? this.write(store, os => rows.forEach(r => os.put(r))).then(() => rows.length) : Promise.resolve(0); },
};

/* ---- backend 2: localStorage, one JSON array per store ---- */
const LSB = {
  _k: s => 'ledger-cfo:store:' + s,
  async init() {
    const probe = 'ledger-cfo:probe';
    localStorage.setItem(probe, '1'); localStorage.removeItem(probe);
    return this;
  },
  _read(store) { try { return JSON.parse(localStorage.getItem(this._k(store)) || '[]'); } catch { return []; } },
  _write(store, rows) {
    try { localStorage.setItem(this._k(store), JSON.stringify(rows)); }
    catch { throw new Error('This browser has run out of local storage. Export a backup and use the installable version of the app.'); }
  },
  async all(store) { return this._read(store); },
  async get(store, key) { return this._read(store).find(r => r[STORES[store].key] === key); },
  async put(store, obj) {
    const k = STORES[store].key, rows = this._read(store);
    const i = rows.findIndex(r => r[k] === obj[k]);
    i >= 0 ? rows[i] = obj : rows.push(obj);
    this._write(store, rows); return obj;
  },
  async del(store, key) { const k = STORES[store].key; this._write(store, this._read(store).filter(r => r[k] !== key)); return true; },
  async clear(store) { this._write(store, []); return true; },
  async bulk(store, rows) {
    if (!rows?.length) return 0;
    const k = STORES[store].key, cur = this._read(store);
    const idx = new Map(cur.map((r, i) => [r[k], i]));
    for (const r of rows) { const i = idx.get(r[k]); i === undefined ? (idx.set(r[k], cur.push(r) - 1)) : (cur[i] = r); }
    this._write(store, cur); return rows.length;
  },
};

/* ---- backend 3: memory, so the app still runs and can be exported ---- */
const MEMB = {
  _m: {},
  async init() { for (const s of Object.keys(STORES)) this._m[s] = []; return this; },
  async all(store) { return (this._m[store] || []).slice(); },
  async get(store, key) { return (this._m[store] || []).find(r => r[STORES[store].key] === key); },
  async put(store, obj) {
    const k = STORES[store].key, rows = this._m[store] ||= [];
    const i = rows.findIndex(r => r[k] === obj[k]);
    i >= 0 ? rows[i] = obj : rows.push(obj); return obj;
  },
  async del(store, key) { const k = STORES[store].key; this._m[store] = (this._m[store] || []).filter(r => r[k] !== key); return true; },
  async clear(store) { this._m[store] = []; return true; },
  async bulk(store, rows) { for (const r of rows || []) await this.put(store, r); return rows?.length || 0; },
};

/** Data entered while on the fallback tier must not be stranded there. */
async function migrateFromLocalStorage() {
  let moved = 0;
  for (const store of Object.keys(STORES)) {
    let rows = [];
    try { rows = JSON.parse(localStorage.getItem('ledger-cfo:store:' + store) || '[]'); } catch {}
    if (!rows.length) continue;
    const existing = await BACKEND.all(store);
    const have = new Set(existing.map(r => r[STORES[store].key]));
    const incoming = rows.filter(r => !have.has(r[STORES[store].key]));
    if (incoming.length) { await BACKEND.bulk(store, incoming); moved += incoming.length; }
    try { localStorage.removeItem('ledger-cfo:store:' + store); } catch {}
  }
  return moved;
}

let BACKEND = null;
const DB = {
  async open() {
    if (BACKEND) return BACKEND;
    /* Safari partitions storage for embedded views; asking first sometimes unlocks it. */
    try {
      if (document.hasStorageAccess && !(await document.hasStorageAccess()) && document.requestStorageAccess) {
        await document.requestStorageAccess().catch(() => {});
      }
    } catch {}
    for (const [mode, backend] of [['indexeddb', IDB], ['localstorage', LSB], ['memory', MEMB]]) {
      try {
        BACKEND = await backend.init(); STORAGE_MODE = mode;
        if (mode === 'indexeddb') {
          try { const n = await migrateFromLocalStorage(); if (n) console.info(`[storage] moved ${n} records out of fallback storage`); } catch {}
        }
        return BACKEND;
      }
      catch (e) {
        const msg = `${mode}: ${e?.name ? e.name + ' — ' : ''}${e?.message || e}`;
        STORAGE_ERROR = STORAGE_ERROR ? STORAGE_ERROR + ' | ' + msg : msg;
        console.warn('[storage]', msg);
      }
    }
    throw new Error('no storage backend available');
  },
  async all(store)        { await this.open(); return BACKEND.all(store); },
  async get(store, key)   { await this.open(); return BACKEND.get(store, key); },
  async put(store, obj)   { await this.open(); return BACKEND.put(store, obj); },
  async del(store, key)   { await this.open(); return BACKEND.del(store, key); },
  async clear(store)      { await this.open(); return BACKEND.clear(store); },
  async bulk(store, rows) { await this.open(); return BACKEND.bulk(store, rows); },
};

/* --------------------------------------------------- preferences (localStorage) */
const PREF_KEY = 'ledger-cfo:prefs';
const DEFAULT_PREFS = {
  theme: 'system',
  notif: Object.fromEntries(NOTIF_CATEGORIES.map(c => [c.id, true])),
  lastPayment: 'UPI',
  presets: [],
  budgetWarnAt: 80,
  openingBalance: 0,
  autoBackupDays: 0,
  lastBackupAt: null,
  onboarded: false,
  browserNotify: false,
  autoPost: true,
  lock: { enabled:false, salt:'', hash:'', faceId:false, credId:'', timeoutMin:0, len:4 },
};
let PREFS = { ...DEFAULT_PREFS };
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREF_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      PREFS = { ...DEFAULT_PREFS, ...o,
        notif: { ...DEFAULT_PREFS.notif, ...(o.notif || {}) },
        lock:  { ...DEFAULT_PREFS.lock,  ...(o.lock  || {}) } };
    }
  } catch { PREFS = { ...DEFAULT_PREFS }; }
}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); } catch {} }

/* ------------------------------------------------------------- cache of data */
const S = {
  expenses: [], income: [], budgets: [], caps: [], bills: [], subscriptions: [],
  investments: [], assets: [], liabilities: [], loans: [], goals: [],
  notifications: [], netWorth: [], recurring: [], categories: [],
};
/* --------------------------------------------------------------- indexes
   Ten years of daily logging is ~20,000 rows. Filtering that array on every
   render is what would eventually make the app feel slow on a phone, so the
   ledger is indexed by day, month and year once per write, and derived
   figures are cached until the next write. */
const EMPTY = Object.freeze([]);
const IDX = { expYM:new Map(), expY:new Map(), expDay:new Map(), incYM:new Map(), incY:new Map() };
const MEMO = new Map();
let DATA_VERSION = 0;

function refreshDerived() {
  for (const m of Object.values(IDX)) m.clear();
  const push = (m, k, v) => { const a = m.get(k); a ? a.push(v) : m.set(k, [v]); };
  for (const e of S.expenses) { push(IDX.expYM, e.ym, e); push(IDX.expY, e.y, e); push(IDX.expDay, e.date, e); }
  for (const i of S.income)   { push(IDX.incYM, i.ym, i); push(IDX.incY, i.y, i); }
  MEMO.clear();
  DATA_VERSION++;
}
/** Cached derived value. Cleared wholesale whenever the ledger changes. */
function memo(key, fn) {
  if (MEMO.has(key)) return MEMO.get(key);
  const v = fn(); MEMO.set(key, v); return v;
}

async function reloadAll() {
  const names = Object.keys(S);
  const results = await Promise.all(names.map(n => DB.all(n)));
  names.forEach((n, i) => { S[n] = results[i]; });
  S.expenses.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  S.income.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  S.notifications.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  applyCategories(S.categories);
  refreshDerived();
}


/* ===== 04-calc.js ===== */
/* ==========================================================================
   CALCULATION ENGINE
   Every figure in this app comes from one of these pure functions, computed
   from the underlying ledger at render time. No total is ever stored or
   hardcoded — change a transaction and everything downstream changes with it.
   All division is zero-safe.
   ========================================================================== */

/* Index-backed for the two hot collections; a plain filter for the rest. */
const inYM  = (rows, ym) => rows === S.expenses ? (IDX.expYM.get(ym) || EMPTY)
                          : rows === S.income   ? (IDX.incYM.get(ym) || EMPTY)
                          : rows.filter(r => r.ym === ym);
const inY   = (rows, y)  => rows === S.expenses ? (IDX.expY.get(y) || EMPTY)
                          : rows === S.income   ? (IDX.incY.get(y) || EMPTY)
                          : rows.filter(r => r.y === y);
const onDay = (rows, iso)=> rows === S.expenses ? (IDX.expDay.get(iso) || EMPTY)
                          : rows.filter(r => r.date === iso);

/** Expenses that represent investing, not consumption. */
const isInvestingExpense = e => e.category === 'investments';
/** Expenses that represent debt service. */
const isDebtExpense = e => e.category === 'emi';

/* ------------------------------------------------------------------ monthly */
function monthStats(ym) { return memo('ms:' + ym, () => {
  const exp = inYM(S.expenses, ym);
  const inc = inYM(S.income, ym);
  const income   = sum(inc, r => r.amount);
  const expenses = sum(exp, r => r.amount);
  const savings  = income - expenses;
  const budget   = sum(inYM(S.budgets, ym), b => b.amount);
  const investOut = sum(exp.filter(isInvestingExpense), r => r.amount);
  const debtOut   = sum(exp.filter(isDebtExpense), r => r.amount);
  const living    = expenses - investOut - debtOut;
  return {
    ym, income, expenses, savings,
    savingsRate: pct(savings, income),
    budget,
    budgetUsed: pct(expenses, budget),
    budgetRemaining: budget - expenses,
    investOut, debtOut, living,
    txCount: exp.length,
    dti: pct(debtOut, income),
  };
}); }

function categoryBreakdown(ym) { return memo('cb:' + ym, () => {
  const exp = inYM(S.expenses, ym);
  const total = sum(exp, r => r.amount);
  return ALL_CATS.map(c => {
    const rows = exp.filter(e => e.category === c.id);
    const spent = sum(rows, r => r.amount);
    return { ...c, spent, count: rows.length, share: pct(spent, total) };
  }).filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent);
}); }

function budgetStatus(ym) { return memo(`bs:${ym}:${PREFS.budgetWarnAt}`, () => {
  const exp = inYM(S.expenses, ym);
  const budgets = inYM(S.budgets, ym);
  const caps = S.caps.filter(c => c.type === 'category');
  return ALL_CATS.map(c => {
    const budget = budgets.find(b => b.category === c.id)?.amount || 0;
    const cap = caps.find(k => k.category === c.id)?.amount || 0;
    const actual = sum(exp.filter(e => e.category === c.id), r => r.amount);
    const used = pct(actual, budget);
    let status = 'none';
    if (budget > 0) status = used >= 100 ? 'r' : used >= (PREFS.budgetWarnAt || 80) ? 'o' : 'g';
    return { ...c, budget, cap, actual, remaining: budget - actual, used, status };
  });
}); }

/* -------------------------------------------------------------------- daily */
function daySpent(iso) { return sum(onDay(S.expenses, iso), r => r.amount); }

function dailyView(iso = todayISO()) {
  const ym = ymOf(iso);
  const dim = daysInMonth(ym);
  const dayNo = +iso.slice(8);
  const isCurrentMonth = ym === currentYM();
  const daysElapsed = isCurrentMonth ? dayNo : dim;
  const daysLeft = Math.max(0, dim - daysElapsed + (isCurrentMonth ? 1 : 0));
  const m = monthStats(ym);
  const spentToday = daySpent(iso);
  const weekStart = addDaysISO(iso, -6);
  const spentWeek = sum(S.expenses.filter(e => e.date >= weekStart && e.date <= iso), r => r.amount);
  const allowanceBase = capFor('monthly')?.amount || m.budget || m.income || 0;
  const remainingPot = allowanceBase - m.expenses;
  return {
    iso, ym, dim, daysElapsed, daysLeft,
    spentToday, spentWeek,
    dailyAverage: daysElapsed > 0 ? m.expenses / daysElapsed : 0,
    allowanceBase,
    remainingPot,
    dailyAllowance: daysLeft > 0 ? remainingPot / daysLeft : remainingPot,
    txToday: onDay(S.expenses, iso).length,
    smallSpend: sum(inYM(S.expenses, ym).filter(e => e.amount <= 200), r => r.amount),
    smallCount: inYM(S.expenses, ym).filter(e => e.amount <= 200).length,
  };
}

function dailySeries(ym) { return memo('ds:' + ym, () => {
  const dim = daysInMonth(ym);
  const exp = inYM(S.expenses, ym);
  const out = [];
  for (let d = 1; d <= dim; d++) {
    const iso = `${ym}-${pad2(d)}`;
    out.push({ day: d, iso, amount: sum(onDay(S.expenses, iso), r => r.amount) });
  }
  return out;
}); }

/* --------------------------------------------------------------- spend caps */
function capFor(type, category) {
  return S.caps.find(c => c.type === type && (type !== 'category' || c.category === category) && c.active !== false);
}
/** Current usage of every active cap, for the given date. */
function capStatus(iso = todayISO()) {
  const ym = ymOf(iso);
  const out = [];
  const daily = capFor('daily');
  if (daily) out.push({ key:'daily', label:'Daily limit', amount: daily.amount, spent: daySpent(iso), scope: dayLabel(iso) });
  const monthly = capFor('monthly');
  if (monthly) out.push({ key:'monthly', label:'Monthly limit', amount: monthly.amount, spent: monthStats(ym).expenses, scope: ymLabel(ym) });
  S.caps.filter(c => c.type === 'category' && c.active !== false).forEach(c => {
    out.push({
      key:'cat:' + c.category, label: catLabel(c.category) + ' limit', amount: c.amount,
      spent: sum(inYM(S.expenses, ym).filter(e => e.category === c.category), r => r.amount),
      scope: ymLabel(ym), category: c.category,
    });
  });
  return out.map(c => ({ ...c, used: pct(c.spent, c.amount), over: c.spent - c.amount }));
}

/* ---------------------------------------------------------- balance sheet */
function investmentTotals() {
  const invested = sum(S.investments, i => i.invested);
  const current = sum(S.investments, i => (i.currentValue ?? i.invested));
  return { invested, current, gain: current - invested, returnPct: pct(current - invested, invested) };
}
function balanceSheet() {
  const manualAssets = sum(S.assets, a => a.value);
  const trackedInvest = investmentTotals().current;
  const manualLiab = sum(S.liabilities, l => l.amount);
  const loanOutstanding = sum(S.loans, l => l.outstanding);
  const totalAssets = manualAssets + trackedInvest;
  const totalLiabilities = manualLiab + loanOutstanding;
  return {
    manualAssets, trackedInvest, totalAssets,
    manualLiab, loanOutstanding, totalLiabilities,
    netWorth: totalAssets - totalLiabilities,
    assetsByType: ASSET_TYPES.map(t => ({ type:t, value: sum(S.assets.filter(a => a.type === t), a => a.value) })).filter(x => x.value),
    liabByType: LIAB_TYPES.map(t => ({ type:t, value: sum(S.liabilities.filter(l => l.type === t), l => l.amount) })).filter(x => x.value),
  };
}

/* ------------------------------------------------------------------ debt */
function debtSummary() {
  const totalDebt = sum(S.loans, l => l.outstanding);
  const totalEmi = sum(S.loans, l => l.emi);
  const today = todayISO();
  const upcoming = S.loans.map(l => {
    const d = +l.dueDay || 1;
    const [y, m] = today.split('-').map(Number);
    let due = `${y}-${pad2(m)}-${pad2(Math.min(d, daysInMonth(`${y}-${pad2(m)}`)))}`;
    if (due < today) { const nm = shiftYM(`${y}-${pad2(m)}`, 1); due = `${nm}-${pad2(Math.min(d, daysInMonth(nm)))}`; }
    return { ...l, nextDue: due, inDays: daysBetween(today, due) };
  }).sort((a, b) => a.nextDue.localeCompare(b.nextDue));
  return { totalDebt, totalEmi, upcoming };
}

/* --------------------------------------------------------- subscriptions */
function subscriptionSummary() {
  const active = S.subscriptions.filter(s => s.status === 'Active');
  const monthly = sum(active, s => cycleToMonthly(s.amount, s.cycle));
  return { active, monthly, yearly: monthly * 12, all: S.subscriptions };
}

/* ---------------------------------------------------------------- cashflow */
function cashFlow(ym, opening = null) {
  const m = monthStats(ym);
  const open = opening ?? openingBalanceFor(ym);
  const closing = open + m.income - m.living - m.investOut - m.debtOut;
  return { ym, opening: open, income: m.income, expenses: m.living, investments: m.investOut, debt: m.debtOut, closing };
}
/** Opening balance rolls forward from the configured start, month by month. */
function openingBalanceFor(ym) { return memo('ob:' + ym, () => {
  const months = allMonthsWithData();
  if (!months.length) return Number(PREFS.openingBalance) || 0;
  let bal = Number(PREFS.openingBalance) || 0;
  for (const m of months) {
    if (m >= ym) break;
    const s = monthStats(m);
    bal += s.income - s.expenses;
  }
  return bal;
}); }
function allMonthsWithData() { return memo('amwd', () => {
  const set = new Set([...S.expenses.map(e => e.ym), ...S.income.map(i => i.ym)]);
  return [...set].sort();
}); }
function yearsWithData() {
  const set = new Set([...S.expenses.map(e => e.y), ...S.income.map(i => i.y), ...S.netWorth.map(n => n.y)]);
  set.add(String(new Date().getFullYear()));
  return [...set].sort();
}

/* ------------------------------------------------------------------ annual */
function annualStatement(year) { return memo('as:' + year, () => {
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const ym = `${year}-${pad2(m)}`;
    const s = monthStats(ym);
    rows.push({ ...s, month: MONTHS[m - 1], mon: MON3[m - 1], hasData: s.income > 0 || s.expenses > 0 });
  }
  const active = rows.filter(r => r.hasData);
  const totalIncome = sum(rows, r => r.income);
  const totalExpenses = sum(rows, r => r.expenses);
  const totalBudget = sum(rows, r => r.budget);
  // Budget utilisation only compares months that actually had a budget set,
  // otherwise unbudgeted months inflate the percentage into nonsense.
  const budgetedExpenses = sum(rows.filter(r => r.budget > 0), r => r.expenses);
  const savings = totalIncome - totalExpenses;
  return {
    year, rows, activeMonths: active.length,
    totalIncome, totalExpenses, totalBudget, budgetedExpenses, savings,
    savingsRate: pct(savings, totalIncome),
    avgIncome: active.length ? totalIncome / active.length : 0,
    avgExpenses: active.length ? totalExpenses / active.length : 0,
    avgSavingsRate: active.length ? sum(active, r => r.savingsRate) / active.length : 0,
    budgetUsed: pct(budgetedExpenses, totalBudget),
    bestSaving: active.slice().sort((a, b) => b.savings - a.savings)[0] || null,
    worstSpend: active.slice().sort((a, b) => b.expenses - a.expenses)[0] || null,
  };
}); }

function annualExpenseReport(year) { return memo('aer:' + year, () => {
  const exp = inY(S.expenses, year);
  const total = sum(exp, r => r.amount);
  const months = new Set(exp.map(e => e.ym)).size || 1;
  return {
    total, months,
    rows: ALL_CATS.map(c => {
      const rows = exp.filter(e => e.category === c.id);
      const spent = sum(rows, r => r.amount);
      return { ...c, spent, share: pct(spent, total), monthlyAvg: spent / months, count: rows.length };
    }).filter(r => r.spent > 0).sort((a, b) => b.spent - a.spent),
  };
}); }

function netWorthHistory(year) {
  const snaps = S.netWorth.filter(n => n.y === String(year)).sort((a, b) => a.ym.localeCompare(b.ym));
  const start = snaps[0]?.netWorth ?? 0;
  const end = snaps[snaps.length - 1]?.netWorth ?? 0;
  return { snaps, start, end, change: end - start, changePct: growth(end, start) };
}

function yearCompare(a, b) {
  const A = annualStatement(a), B = annualStatement(b);
  const nwA = netWorthHistory(a), nwB = netWorthHistory(b);
  const invA = sum(inY(S.expenses, a).filter(isInvestingExpense), r => r.amount);
  const invB = sum(inY(S.expenses, b).filter(isInvestingExpense), r => r.amount);
  const debtA = sum(inY(S.expenses, a).filter(isDebtExpense), r => r.amount);
  const debtB = sum(inY(S.expenses, b).filter(isDebtExpense), r => r.amount);
  const line = (label, x, y, fmt = money) => ({ label, a: x, b: y, delta: y - x, pct: growth(y, x), fmt });
  return [
    line('Income', A.totalIncome, B.totalIncome),
    line('Expenses', A.totalExpenses, B.totalExpenses),
    line('Savings', A.savings, B.savings),
    line('Savings rate', A.savingsRate, B.savingsRate, v => pctStr(v)),
    line('Investments', invA, invB),
    line('Debt payments', debtA, debtB),
    line('Net worth (end)', nwA.end, nwB.end),
  ];
}

/* -------------------------------------------------------------------- goals */
function goalProgress(g) {
  const p = pct(g.current, g.target);
  return { ...g, progress: p, remaining: Math.max(0, (g.target || 0) - (g.current || 0)),
           daysLeft: g.targetDate ? daysBetween(todayISO(), g.targetDate) : null };
}

/* -------------------------------------------------------------------- bills */
function upcomingBills(days = 14) {
  const t = todayISO(), until = addDaysISO(t, days);
  const b = S.bills.filter(x => x.status !== 'Paid' && x.dueDate <= until)
    .map(x => ({ ...x, kind:'bill', when: x.dueDate, inDays: daysBetween(t, x.dueDate) }));
  const s = S.subscriptions.filter(x => x.status === 'Active' && x.nextBillingDate <= until)
    .map(x => ({ ...x, name: x.service, kind:'subscription', when: x.nextBillingDate, inDays: daysBetween(t, x.nextBillingDate) }));
  const l = debtSummary().upcoming.filter(x => x.nextDue <= until)
    .map(x => ({ ...x, amount: x.emi, kind:'emi', when: x.nextDue, inDays: x.inDays }));
  return [...b, ...s, ...l].sort((a, b2) => a.when.localeCompare(b2.when));
}

/* ------------------------------------------------------------------ search */
function globalSearch(q) {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const hit = (...fields) => fields.some(f => String(f ?? '').toLowerCase().includes(s));
  const out = [];
  S.expenses.forEach(e => { if (hit(e.description, e.notes, catLabel(e.category), e.subcategory, e.paymentMethod, e.amount)) out.push({ kind:'Expense', title:e.description || catLabel(e.category), sub:`${dateLabel(e.date)} · ${catLabel(e.category)} · ${e.paymentMethod}`, amount:-e.amount, ref:e, route:'transactions' }); });
  S.income.forEach(i => { if (hit(i.source, i.notes, i.type, i.amount)) out.push({ kind:'Income', title:i.source, sub:`${dateLabel(i.date)} · ${i.type}`, amount:i.amount, ref:i, route:'income' }); });
  S.bills.forEach(b => { if (hit(b.name, b.notes, b.category)) out.push({ kind:'Bill', title:b.name, sub:`Due ${dateLabel(b.dueDate)} · ${b.status}`, amount:-b.amount, ref:b, route:'bills' }); });
  S.subscriptions.forEach(x => { if (hit(x.service, x.notes, x.category)) out.push({ kind:'Subscription', title:x.service, sub:`${x.cycle} · next ${dateLabel(x.nextBillingDate)}`, amount:-x.amount, ref:x, route:'subscriptions' }); });
  S.investments.forEach(x => { if (hit(x.name, x.platform, x.type, x.notes)) out.push({ kind:'Investment', title:x.name, sub:`${x.type} · ${x.platform || '—'}`, amount:x.currentValue ?? x.invested, ref:x, route:'investments' }); });
  S.assets.forEach(x => { if (hit(x.name, x.type, x.notes)) out.push({ kind:'Asset', title:x.name, sub:x.type, amount:x.value, ref:x, route:'balance' }); });
  S.liabilities.forEach(x => { if (hit(x.name, x.type, x.notes)) out.push({ kind:'Liability', title:x.name, sub:x.type, amount:-x.amount, ref:x, route:'balance' }); });
  S.loans.forEach(x => { if (hit(x.name, x.notes)) out.push({ kind:'Loan', title:x.name, sub:`EMI ${money(x.emi)} · ${x.interestRate || 0}%`, amount:-x.outstanding, ref:x, route:'loans' }); });
  S.goals.forEach(x => { if (hit(x.name, x.type, x.notes)) out.push({ kind:'Goal', title:x.name, sub:`${pctStr(pct(x.current, x.target),0)} of ${money(x.target)}`, amount:x.current, ref:x, route:'goals' }); });
  return out.slice(0, 120);
}

/* ----------------------------------------------------------------- forecast
   Projects the month's finish from the pace so far. Deliberately simple and
   explainable — spent ÷ days elapsed × days in month — because a figure you
   cannot check in your head is a figure you will not trust. */
function forecast(ym = currentYM()) {
  const m = monthStats(ym);
  const dim = daysInMonth(ym);
  const isCurrent = ym === currentYM();
  const elapsed = isCurrent ? +todayISO().slice(8) : dim;
  const pace = elapsed > 0 ? m.expenses / elapsed : 0;
  const projected = pace * dim;
  const plan = capFor('monthly')?.amount || m.budget || 0;
  return {
    ym, dim, elapsed, daysLeft: Math.max(0, dim - elapsed),
    spent: m.expenses, pace, projected,
    plan,
    projectedOver: plan > 0 ? projected - plan : 0,
    onTrack: plan > 0 ? projected <= plan : null,
    projectedSavings: m.income - projected,
    complete: !isCurrent,
  };
}

/* ---------------------------------------------------------------- heatmap */
function heatmapDays(ym) {
  const series = dailySeries(ym);
  const max = Math.max(...series.map(d => d.amount), 0);
  const today = todayISO();
  const first = new Date(`${ym}-01T00:00:00`).getDay();   // 0 = Sunday
  return {
    max, series, leadingBlanks: (first + 6) % 7,          // weeks start Monday
    cells: series.map(d => ({
      ...d,
      intensity: max > 0 ? d.amount / max : 0,
      future: d.iso > today,
      isToday: d.iso === today,
    })),
  };
}

/* ==========================================================================
   UI PRIMITIVES — toast, bottom sheet, confirm dialog, alert dialog
   ========================================================================== */
function toast(msg, action) {
  const host = $('#toasts');
  /* Repeating the same message replaces it rather than stacking — cycling the
     theme three times should leave one toast, not a tower of them. */
  [...host.children].forEach(c => { if (c.dataset.msg === msg) c.remove(); });
  while (host.children.length >= 2) host.firstElementChild.remove();
  const el = document.createElement('div');
  el.dataset.msg = msg;
  el.className = 'toast';
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { el.remove(); action.fn(); };
    el.appendChild(b);
  }
  host.appendChild(el);
  setTimeout(() => el.remove(), action ? 6000 : 3200);
}

let sheetStack = [];
function openSheet({ title, body, footer, onMount, wide }) {
  const host = $('#modalHost');
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sheet-head"><h3>${esc(title)}</h3>
      <button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">${body}</div>
    ${footer ? `<div class="sheet-foot">${footer}</div>` : ''}`;
  host.append(scrim, sheet);
  requestAnimationFrame(() => { scrim.classList.add('on'); sheet.classList.add('on'); });
  const close = () => {
    scrim.classList.remove('on'); sheet.classList.remove('on');
    setTimeout(() => { scrim.remove(); sheet.remove(); }, 260);
    sheetStack = sheetStack.filter(s => s.sheet !== sheet);
  };
  scrim.onclick = close;
  $('[data-close]', sheet).onclick = close;
  sheetStack.push({ sheet, close });
  onMount?.(sheet, close);
  const first = sheet.querySelector('input,select,textarea');
  if (first && window.matchMedia('(min-width:900px)').matches) setTimeout(() => first.focus(), 280);
  return { sheet, close };
}
function closeTopSheet() { sheetStack[sheetStack.length - 1]?.close(); }

function confirmDialog({ title, message, facts = [], confirmLabel = 'Confirm', danger = false, tone = 'warn', requireText = null }) {
  return new Promise(resolve => {
    const host = $('#modalHost');
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const d = document.createElement('div'); d.className = 'dialog';
    const toneMap = { warn:['var(--warn-soft)','var(--warn)','⚠️'], bad:['var(--bad-soft)','var(--bad)','⛔'], good:['var(--good-soft)','var(--good)','✅'], info:['var(--accent-soft)','var(--accent)','ℹ️'] };
    const [bg, fg, ic] = toneMap[tone] || toneMap.warn;
    d.innerHTML = `
      <div class="d-ic" style="background:${bg};color:${fg}">${ic}</div>
      <h3>${esc(title)}</h3>
      <p>${message}</p>
      ${facts.length ? `<div class="d-facts">${facts.map(f => `<div><span>${esc(f[0])}</span><span>${f[1]}</span></div>`).join('')}</div>` : ''}
      ${requireText ? `<div class="field" style="margin-top:12px"><label>Type <b>${esc(requireText)}</b> to confirm</label><input class="input" id="confText" autocomplete="off"></div>` : ''}
      <div class="btnrow" style="margin-top:16px">
        <button class="btn ghost" data-no>Cancel</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-yes ${requireText ? 'disabled' : ''}>${esc(confirmLabel)}</button>
      </div>`;
    host.append(scrim, d);
    requestAnimationFrame(() => { scrim.classList.add('on'); d.classList.add('on'); });
    const done = v => { scrim.classList.remove('on'); d.classList.remove('on'); setTimeout(() => { scrim.remove(); d.remove(); }, 220); resolve(v); };
    scrim.onclick = () => done(false);
    $('[data-no]', d).onclick = () => done(false);
